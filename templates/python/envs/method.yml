# The method's one environment: your dependencies plus the driver. Everything here counts
# toward your bloat (on-disk size and package count of the built env), so list only what you use.
name: method
channels: [conda-forge, nodefaults]
dependencies:
  - python=3.13
  - scanpy=1.12
  - python-igraph
  - pip
  - pip:
      - obkit==0.0.3
      - brrr @ git+https://github.com/btraven00/sc-brrr@main#subdirectory=brrr   # TODO: pin a commit / release
