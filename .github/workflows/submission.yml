# Static checks on a submission PR (docs/challenge/rules.md): nothing submitted runs here.
# Per changed submissions/<account>/<name>-<X.Y.Z>.yaml: `score.py --check` (fields, env pins,
# the module repo at its pinned commit through `ob validate module --strict` and its entrypoint,
# `ob validate plan` with the entry in it, and the version gate against the public results repo).
# Scoring stays manual, on the scoring host: ./score.py <submission>.
name: submission

on:
  pull_request:
    paths: ["submissions/**"]

permissions:
  contents: read   # no secrets, no write token: the PR's code is untrusted

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only submission files changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          other=$(git diff --name-only "$BASE"...HEAD | grep -vE '^submissions/[a-z][a-z0-9_-]*/[^/]+\.ya?ml$' || true)
          if [ -n "$other" ]; then
            echo "::error::a submission PR changes only submissions/<account>/ files; also changed:"; echo "$other"; exit 1
          fi

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: ob
      - uses: astral-sh/setup-uv@v5

      - name: Results repo, for the version gate
        run: git clone -q --depth 1 https://github.com/btraven00/sc-brrr-results ../sc-brrr-results

      - name: Check the changed submissions
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # an env-only change re-checks its submission
          subs=$(git diff --name-only --diff-filter=AMR "$BASE"...HEAD -- submissions/ \
                 | sed 's/\.env\.yml$/.yaml/' | grep '\.yaml$' | sort -u)
          fail=0
          for s in $subs; do
            [ -f "$s" ] || { echo "::error file=$s::no $s (an env file without its submission)"; fail=1; continue; }
            echo "::group::$s"
            ./score.py --check "$s" || { echo "::error file=$s::$s: rejected (see the log above)"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
