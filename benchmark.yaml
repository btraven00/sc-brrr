# sc-brrr Phase 0 pilot: the scanpy baseline. See protocol.typ / docs/infrastructure.typ.
id: sc_brrr
name: sc-brrr
description: Computational trade-offs of GPU-accelerated single-cell pipelines (omni-scrna slice)
benchmarker: "btraven <ben.uzh@proton.me>"
version: "0.0.1"
api_version: "0.7.0"

software_backend: conda
software_environments:
  omni-data: {conda: prep/envs/omni-data.yml}
  scanpy: {conda: modules/scanpy/envs/scanpy.linux-64.lock.yml}  # x86-nvidia profile; regenerate with pixi run lock-env
  rapids: {conda: modules/rapids-singlecell/envs/rapids-singlecell.linux-64.lock.yml}  # CUDA 13 wheels; same regeneration

stages:
  # One module per dataset size. TODO(zenodo): switch to source: zenodo + accession + hash once published.
  - id: data
    provides: [size]
    outputs:
      - {id: data_h5ad, path: "{name}.h5ad"}
    modules:
      - id: hao2021_10k
        provides: {size: "10k"}
        software_environment: omni-data
        repository: {url: https://github.com/btraven00/omni-data, commit: b4d6c62}
        parameters:
          - {uri: "file:///home/b/phd/sc-brrr/data/prep/hao2021_10k.h5ad", uri_type: file}
      - id: hao2021_50k
        provides: {size: "50k"}
        software_environment: omni-data
        repository: {url: https://github.com/btraven00/omni-data, commit: b4d6c62}
        parameters:
          - {uri: "file:///home/b/phd/sc-brrr/data/prep/hao2021_50k.h5ad", uri_type: file}
      - id: hao2021_100k
        provides: {size: "100k"}
        software_environment: omni-data
        repository: {url: https://github.com/btraven00/omni-data, commit: b4d6c62}
        parameters:
          - {uri: "file:///home/b/phd/sc-brrr/data/prep/hao2021_100k.h5ad", uri_type: file}

  # Timed stage. Every method writes the same three files.
  - id: pipeline
    inputs: [data_h5ad]
    outputs:
      - {id: embedding_tsv, path: "{name}_embedding.tsv"}
      - {id: neighbors_h5, path: "{name}_neighbors.h5"}
      - {id: clusters_tsv, path: "{name}_clusters.tsv"}
    # Phase 0 budget: 6 GB holds to ~0.5M cells (projection in infrastructure.typ); 5 min per timed method
    resources: {cores: 8, mem_mb: 6144, runtime: 5}
    modules:
      # Untimed: the exact kNN reference that every method's fidelity is scored against.
      # Run once per size (seed 0), never ranked. Longer runtime (20 min): it is not a contender.
      - id: reference
        name: "Reference: scanpy PCA (arpack) -> exact kNN (sklearn brute force) -> Leiden (igraph)"
        software_environment: scanpy
        resources: {cores: 8, mem_mb: 6144, runtime: 20}
        repository: &scanpy_repo
          url: https://github.com/btraven00/scanpy   # branch sc-brrr-pipeline; modules/scanpy is its submodule checkout
          commit: 7fb3c8f
          entrypoint: fuse-prof
        parameters:
          - &scanpy_fixed
            steps: PCA,NNG,CLUST
            threads: 8
            warmup_cells: 5000   # in-process warm-up >= 4096 cells (scanpy kNN switch); see infrastructure.typ
            pca_solver: arpack
            pca_n_components: 50
            pca_dtype: float64
            pca_random_seed: 0
            nng_n_neighbors: 15
            nng_knn_transformer: sklearn
            nng_random_seed: 0
            clust_resolution: 1.0
            clust_leiden_flavor: igraph
            clust_random_seed: 0
            replicate: 0

      # Tier 0, timed: scanpy as people run it. kNN uses scanpy's default, pynndescent
      # (approximate above 4096 cells).
      - id: scanpy
        name: "Tier 0: scanpy defaults, PCA (arpack) -> kNN (pynndescent) -> Leiden (igraph), fused in-process"
        software_environment: scanpy
        repository: *scanpy_repo
        parameters:
          # Replicates run in one process after one warm-up (rep<r>/ in the output dir), so
          # the warm-up is paid once per job, not once per replicate.
          # 6 same-seed replicates: nondeterminism, and the timed runs.
          - &scanpy_timed
            <<: *scanpy_fixed
            nng_knn_transformer: pynndescent
            replicates: 6
            seed_stride: 0
          # 5 different seeds: seed sensitivity (RQ5). One seed drives all three steps:
          # replicate r uses seed 1 + r for PCA, kNN and Leiden alike.
          - {<<: *scanpy_timed, pca_random_seed: 1, nng_random_seed: 1, clust_random_seed: 1, replicates: 5, seed_stride: 1}

      # Tier 2b, timed: rapids-singlecell with X uploaded once and everything resident in VRAM.
      # Exact kNN (cuVS brute force), so its graph is comparable to the reference's.
      - id: rsc
        name: "Tier 2b: rapids-singlecell, PCA -> kNN (cuVS brute) -> Leiden, resident on the GPU, fused in-process"
        software_environment: rapids
        requires_capabilities: [cuda]
        repository:
          url: https://github.com/btraven00/rapids-singlecell   # branch sc-brrr-fuse; modules/rapids-singlecell is its submodule checkout
          commit: c3e1ebe
          entrypoint: fuse-prof
        parameters:
          # Same design as scanpy: 6 same-seed replicates + 5 paired seeds, in-process after one warm-up.
          - &rsc_timed
            steps: PCA,NNG,CLUST
            threads: 8
            warmup_cells: 5000
            pca_n_components: 50
            pca_dtype: float64
            pca_random_seed: 0
            nng_n_neighbors: 15
            nng_knn_algorithm: brute
            nng_random_seed: 0
            clust_resolution: 1.0
            clust_random_seed: 0
            replicates: 6
            seed_stride: 0
          - {<<: *rsc_timed, pca_random_seed: 1, nng_random_seed: 1, clust_random_seed: 1, replicates: 5, seed_stride: 1}

  # Untimed. One node per size, every pipeline run of that size as a member.
  # The module only knows --name, not the group, so the size lives in the path.
  - id: metrics
    gather:
      - {from: clusters_tsv, group_by: data}
    outputs:
      - {id: metrics_tsv, path: "{name}_metrics.tsv"}
    modules:
      - id: n_clusters
        name: "Cluster count per run (no reference needed)"
        software_environment: scanpy
        repository: {url: https://github.com/btraven00/sc-brrr, commit: aa7ea5a, entrypoint: n-clusters}

  # Next increment, once its module exists:
  # - id: report           # global gather -> scoreboard.md (Pages)
