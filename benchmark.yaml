# sc-brrr Phase 0 pilot: the scanpy baseline. See protocol.typ / docs/infrastructure.typ.
id: sc_brrr
name: sc-brrr
description: Computational trade-offs of GPU-accelerated single-cell pipelines (omni-scrna slice)
benchmarker: "btraven <ben.uzh@proton.me>"
version: "0.0.1"
api_version: "0.7.0"

software_backend: conda
software_environments:
  omni-data: {conda: prep/envs/omni-data.yml}
  scanpy: {conda: envs/scanpy.linux-64.lock.yml}  # x86-nvidia profile; locked from omni-scrna/scanpy's pixi.lock
  rapids: {conda: envs/rapids.linux-64.lock.yml}  # CUDA 13 wheels; locked from rapids-singlecell's pixi.lock

stages:
  # One module per dataset size. TODO(zenodo): switch to source: zenodo + accession + hash once published.
  - id: data
    provides: [size]
    outputs:
      - {id: data_h5ad, path: "{name}.h5ad"}
    modules:
      - id: hao2021_10k
        provides: {size: "10k"}
        software_environment: omni-data
        repository: {url: https://github.com/btraven00/omni-data, commit: b4d6c62}
        parameters:
          - {uri: "file:///home/b/phd/sc-brrr/data/prep/hao2021_10k.h5ad", uri_type: file}
      - id: hao2021_50k
        provides: {size: "50k"}
        software_environment: omni-data
        repository: {url: https://github.com/btraven00/omni-data, commit: b4d6c62}
        parameters:
          - {uri: "file:///home/b/phd/sc-brrr/data/prep/hao2021_50k.h5ad", uri_type: file}
      - id: hao2021_100k
        provides: {size: "100k"}
        software_environment: omni-data
        repository: {url: https://github.com/btraven00/omni-data, commit: b4d6c62}
        parameters:
          - {uri: "file:///home/b/phd/sc-brrr/data/prep/hao2021_100k.h5ad", uri_type: file}

  # Timed stage. Every method writes the same three files.
  - id: pipeline
    inputs: [data_h5ad]
    outputs:
      - {id: embedding_tsv, path: "{name}_embedding.tsv"}
      - {id: neighbors_h5, path: "{name}_neighbors.h5"}
      - {id: clusters_tsv, path: "{name}_clusters.tsv"}
    # Phase 0 budget: 6 GB holds to ~0.5M cells (projection in infrastructure.typ); 5 min per timed method
    resources: {cores: 8, mem_mb: 6144, runtime: 5}
    modules:
      # Untimed: the exact kNN reference that every method's fidelity is scored against.
      # Run once per size (seed 0), never ranked. Longer runtime (20 min): it is not a contender.
      # Ours (baselines/reference.py, brrr driver): omni-scrna's knn.py can't select exact kNN.
      - id: reference
        name: "Reference: scanpy PCA (arpack) -> exact kNN (sklearn brute force) -> Leiden (igraph)"
        software_environment: scanpy
        resources: {cores: 8, mem_mb: 6144, runtime: 20}
        repository: {url: https://github.com/btraven00/sc-brrr, commit: 76bf3c5, entrypoint: reference}
        parameters:
          - {random_seed: 0, n_components: 50, n_neighbors: 15, resolution: 1.0, replicate: 0}

      # The baselines are omni-scrna modules run unchanged: the brrr fuser (entrypoint `fuse`)
      # runs their PCA, kNN and clustering scripts in one process, after one warm-up, with
      # in-process replicates (rep<r>/ in the output dir). `module` pins the upstream commit;
      # `<stage>_<param>` reaches that stage's script as `--<param>`.

      # CPU baseline, timed: scanpy as people run it. kNN uses scanpy's default, pynndescent
      # (approximate above 4096 cells).
      - id: scanpy
        name: "CPU baseline: omni-scrna/scanpy (+ shared-io), PCA (arpack) -> kNN (pynndescent) -> Leiden (igraph), fused"
        software_environment: scanpy
        repository: &fuse {url: https://github.com/btraven00/sc-brrr, commit: 76bf3c5, entrypoint: fuse}
        parameters:
          # 6 same-seed replicates: nondeterminism, and the timed runs.
          - &scanpy_timed
            module: https://github.com/btraven00/scanpy@97d8498dd1869388f47b29ca5eb110a8ae2f8703   # shared-io: upstream b98b70b + knn/cluster through writers.py pairs (in-memory handoff); back to omni-scrna once merged
            stages: pca=pca.py,knn=knn.py,cluster=cluster.py
            warmup_cells: 5000   # >= 4096 cells, so the warm-up takes scanpy's pynndescent path
            pca_solver: arpack
            pca_n_components: 50
            pca_dtype: float64
            knn_n_neighbors: 15
            knn_flavor: umap
            cluster_resolution: 1.0
            cluster_flavor: igraph
            random_seed: 0
            replicates: 6
            seed_stride: 0
          # 5 different seeds: seed sensitivity (RQ5). Replicate r uses seed 1 + r in every stage.
          - {<<: *scanpy_timed, random_seed: 1, replicates: 5, seed_stride: 1}

      # GPU baseline, timed: rapids-singlecell. Exact kNN (cuVS brute force), so its graph is
      # comparable to the reference's.
      - id: rsc
        name: "GPU baseline: omni-scrna/rapids-singlecell, PCA (covariance eigh) -> kNN (cuVS brute) -> Leiden, fused"
        software_environment: rapids
        requires_capabilities: [cuda]
        repository: *fuse
        parameters:
          - &rsc_timed
            module: https://github.com/omni-scrna/rapids-singlecell@29b6614ca06b7aefb2d475377b5600f9dcd6fd64
            stages: pca=pca.py,knn=knn.py,cluster=cluster_graph.py
            warmup_cells: 5000
            pca_solver: covariance-eigh
            pca_n_components: 50
            pca_dtype: float64
            knn_n_neighbors: 15
            knn_flavor: rapids
            cluster_method: rapids-leiden
            cluster_resolution: 1.0
            random_seed: 0
            replicates: 6
            seed_stride: 0
          - {<<: *rsc_timed, random_seed: 1, replicates: 5, seed_stride: 1}

  # Untimed. One node per size, every pipeline run of that size as a member.
  # The module only knows --name, not the group, so the size lives in the path.
  - id: metrics
    gather:
      - {from: clusters_tsv, group_by: data}
    outputs:
      - {id: metrics_jsonl, path: "{name}_metrics.jsonl"}   # records: specs/README.md
    modules:
      - id: n_clusters
        name: "Cluster count per run (no reference needed)"
        software_environment: scanpy
        repository: {url: https://github.com/btraven00/sc-brrr, commit: 76bf3c5, entrypoint: n-clusters}
      - id: contract
        name: "Every output of every replicate against specs/types.yaml"
        software_environment: scanpy
        repository: {url: https://github.com/btraven00/sc-brrr, commit: 76bf3c5, entrypoint: contract}

  # Next increment, once its module exists:
  # - id: report           # global gather -> scoreboard.md (Pages)
