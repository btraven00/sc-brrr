# sc-brrr Phase 0 pilot: the scanpy baseline. See protocol.typ / docs/infrastructure.typ.
id: sc_brrr
name: sc-brrr
description: Computational trade-offs of GPU-accelerated single-cell pipelines (omni-scrna slice)
benchmarker: "btraven <ben.uzh@proton.me>"
version: "0.0.1"
api_version: "0.7.0"

software_backend: conda
software_environments:
  omni-data: {conda: prep/envs/omni-data.yml}
  scanpy: {conda: modules/scanpy/envs/scanpy.linux-64.lock.yml}  # x86-nvidia profile; regenerate with pixi run lock-env

stages:
  # One module per dataset size. TODO(zenodo): switch to source: zenodo + accession + hash once published.
  - id: data
    provides: [size]
    outputs:
      - {id: data_h5ad, path: "{name}.h5ad"}
    modules:
      - id: hao2021_10k
        provides: {size: "10k"}
        software_environment: omni-data
        repository: {url: https://github.com/btraven00/omni-data, commit: b4d6c62}
        parameters:
          - {uri: "file:///home/b/phd/sc-brrr/data/prep/hao2021_10k.h5ad", uri_type: file}
      - id: hao2021_50k
        provides: {size: "50k"}
        software_environment: omni-data
        repository: {url: https://github.com/btraven00/omni-data, commit: b4d6c62}
        parameters:
          - {uri: "file:///home/b/phd/sc-brrr/data/prep/hao2021_50k.h5ad", uri_type: file}
      - id: hao2021_all
        provides: {size: "all"}
        software_environment: omni-data
        repository: {url: https://github.com/btraven00/omni-data, commit: b4d6c62}
        parameters:
          - {uri: "file:///home/b/phd/sc-brrr/data/prep/hao2021_all.h5ad", uri_type: file}

  # Timed stage. Every method writes the same three files.
  - id: pipeline
    inputs: [data_h5ad]
    outputs:
      - {id: embedding_tsv, path: "{name}_embedding.tsv"}
      - {id: neighbors_h5, path: "{name}_neighbors.h5"}
      - {id: clusters_tsv, path: "{name}_clusters.tsv"}
    resources: {cores: 8, mem_mb: 6144, runtime: 30}
    modules:
      # Untimed: the exact kNN reference that every method's fidelity is scored against.
      # Run once per size (seed 0), never ranked. Generous runtime: it is not a contender.
      - id: reference
        name: "Reference: scanpy PCA (arpack) -> exact kNN (sklearn brute force) -> Leiden (igraph)"
        software_environment: scanpy
        resources: {cores: 8, mem_mb: 6144, runtime: 240}
        repository: &scanpy_repo
          url: https://github.com/btraven00/scanpy   # branch sc-brrr-pipeline; modules/scanpy is its submodule checkout
          commit: ff12ada
          entrypoint: fuse-prof
        parameters:
          - &scanpy_fixed
            steps: PCA,NNG,CLUST
            threads: 8
            pca_solver: arpack
            pca_n_components: 50
            pca_dtype: float64
            pca_random_seed: 0
            nng_n_neighbors: 15
            nng_knn_transformer: sklearn
            nng_random_seed: 0
            clust_resolution: 1.0
            clust_leiden_flavor: igraph
            clust_random_seed: 0
            replicate: 0

      # Tier 0, timed: scanpy as people run it. kNN uses scanpy's default, pynndescent
      # (approximate above 4096 cells).
      - id: scanpy
        name: "Tier 0: scanpy defaults, PCA (arpack) -> kNN (pynndescent) -> Leiden (igraph), fused in-process"
        software_environment: scanpy
        repository: *scanpy_repo
        parameters:
          # 5 same-seed replicates: nondeterminism, and the timed runs. Warm-up is replicate 0.
          - &scanpy_timed
            <<: *scanpy_fixed
            nng_knn_transformer: pynndescent
            replicate: [0, 1, 2, 3, 4, 5]
          # 5 different seeds: seed sensitivity (RQ5). One seed drives all three steps, so they
          # are paired by hand; a grid over three seed lists would give 125 combos.
          - {<<: *scanpy_timed, pca_random_seed: 1, nng_random_seed: 1, clust_random_seed: 1, replicate: 1}
          - {<<: *scanpy_timed, pca_random_seed: 2, nng_random_seed: 2, clust_random_seed: 2, replicate: 1}
          - {<<: *scanpy_timed, pca_random_seed: 3, nng_random_seed: 3, clust_random_seed: 3, replicate: 1}
          - {<<: *scanpy_timed, pca_random_seed: 4, nng_random_seed: 4, clust_random_seed: 4, replicate: 1}
          - {<<: *scanpy_timed, pca_random_seed: 5, nng_random_seed: 5, clust_random_seed: 5, replicate: 1}

  # Next increments, once their modules exist:
  # - id: metrics          # gather from clusters_tsv/neighbors_h5/embedding_tsv, group_by: data
  # - id: report           # global gather -> scoreboard.md (Pages)
